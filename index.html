<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stefan i shorts</title>
<meta name="description" content="Ett litet pixelspel om Stefan, shorts och adrenalin. Grattis på födelsedagen!">
<meta property="og:title" content="Stefan i shorts">
<meta property="og:description" content="Ett litet pixelspel om Stefan, shorts och adrenalin. Grattis på födelsedagen!">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --page:#f1e4d0; --ink:#3a2a44; --frame:#2a1d33; --btn:#3a2a44; --btn-ink:#fbeede; --btn-shadow:#1c1322;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#17101d; --ink:#d8c9e4; --frame:#000; --btn:#3a2a44; --btn-ink:#fbeede; --btn-shadow:#08050b; }
}
:root[data-theme="dark"]{ --page:#17101d; --ink:#d8c9e4; --frame:#000; --btn:#3a2a44; --btn-ink:#fbeede; --btn-shadow:#08050b; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--page);color:var(--ink);
  font-family:'VT323',ui-monospace,Menlo,Consolas,monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#screen{
  position:relative;aspect-ratio:4/3;
  width:min(calc(100vw - 24px),960px,calc((100vh - 70px) * 4 / 3));
  border:4px solid var(--frame);border-radius:8px;overflow:hidden;background:#000;
  box-shadow:0 12px 32px rgba(0,0,0,.35);
}
@supports (height:100dvh){ #screen{ width:min(calc(100vw - 24px),960px,calc((100dvh - 70px) * 4 / 3)); } }
body.touch #screen{ width:min(calc(100vw - 12px),960px,calc((100vh - 240px) * 4 / 3)); }
@supports (height:100dvh){ body.touch #screen{ width:min(calc(100vw - 12px),960px,calc((100dvh - 240px) * 4 / 3)); } }
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}

#dialog{
  position:absolute;left:3%;right:3%;bottom:3%;display:none;
  background:rgba(22,14,30,.95);border:3px solid #fbeede;border-radius:6px;
  box-shadow:0 0 0 3px #160e1e;padding:.45em .8em .6em;color:#fbeede;
  font-size:max(17px,calc(var(--u,3px) * 9));line-height:1.08;cursor:pointer;
}
#dname{font-family:'Press Start 2P',monospace;font-size:.5em;color:#ff9d5c;margin-bottom:.45em}
#dtext{min-height:2.1em;white-space:pre-wrap}
#dchoices{display:flex;flex-direction:column;gap:.12em;margin-top:.3em}
#dchoices button{font:inherit;color:#fbeede;background:transparent;border:0;text-align:left;padding:.08em .3em;border-radius:3px;cursor:pointer}
#dchoices button.sel{background:#fbeede;color:#1e1328}
#dchoices button:focus-visible{outline:2px solid #ff9d5c}
#dnext{position:absolute;right:.6em;bottom:.25em;color:#ff9d5c;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff}
#title{justify-content:flex-start;padding-top:5%;gap:calc(var(--u,3px)*4)}
#title h1{
  font-family:'Press Start 2P',monospace;font-weight:400;margin:0;line-height:1.3;
  font-size:calc(var(--u,3px) * 15);color:#fffaf0;letter-spacing:.02em;
  text-shadow:calc(var(--u,3px)*1.4) calc(var(--u,3px)*1.4) 0 #c23b22, calc(var(--u,3px)*2.8) calc(var(--u,3px)*2.8) 0 #3a1d12;
}
#title p{margin:0;font-size:max(18px,calc(var(--u,3px)*10));color:#3a1d12}
.pixbtn{
  font-family:'Press Start 2P',monospace;font-size:max(12px,calc(var(--u,3px)*6));
  background:#2a7fd4;color:#fff;border:0;padding:.8em 1.3em;border-radius:4px;cursor:pointer;
  box-shadow:0 .35em 0 #174a80;
}
.pixbtn:active{transform:translateY(.2em);box-shadow:0 .15em 0 #174a80}
.pixbtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
#final{display:none;justify-content:center;gap:calc(var(--u,3px)*5);background:rgba(28,12,36,.6);padding:0 6%}
#final h2{font-family:'Press Start 2P',monospace;font-weight:400;margin:0;font-size:calc(var(--u,3px)*12);line-height:1.35;color:#ffd23f;text-shadow:calc(var(--u,3px)*1.4) calc(var(--u,3px)*1.4) 0 #c23b22}
#final p.date{font-family:'Press Start 2P',monospace;font-size:calc(var(--u,3px)*6);color:#fff}
#final p{margin:0;font-size:max(18px,calc(var(--u,3px)*10));max-width:32ch}

#hint{font-size:20px;opacity:.85;text-align:center;padding:0 12px}
#pad{display:none;width:min(calc(100vw - 16px),520px);justify-content:space-between;align-items:center;padding:0 10px;touch-action:none}
body.touch #pad{display:flex}
body.touch #hint{display:none}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px)}
.dpad button{background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;font-size:22px;box-shadow:0 5px 0 var(--btn-shadow);touch-action:none}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
#abtn{width:88px;height:88px;border-radius:50%;border:0;background:#e0492f;color:#fff;font-family:'Press Start 2P',monospace;font-size:24px;box-shadow:0 6px 0 #7d2413;touch-action:none}
#abtn.ready{background:#ff6a3d}
#pad button:active{transform:translateY(3px)}
@media (prefers-reduced-motion: reduce){#dnext{animation:none}}
</style>
</head>
<body>
<div id="screen">
  <canvas id="c" width="320" height="240" aria-label="Spelet Stefan i shorts"></canvas>
  <div id="dialog" role="dialog" aria-live="polite">
    <div id="dname"></div>
    <div id="dtext"></div>
    <div id="dchoices"></div>
    <div id="dnext">▼</div>
  </div>
  <div id="title" class="overlay">
    <h1>STEFAN<br>I SHORTS</h1>
    <p>Ett adrenalinäventyr</p>
    <button id="startBtn" class="pixbtn">Starta</button>
  </div>
  <div id="final" class="overlay">
    <h2>GRATTIS<br>STEFAN!</h2>
    <p class="date">28 september</p>
    <p>Du tog dig igenom hela din födelsedag utan långbyxor. Imponerande i din ålder.</p>
    <p id="fromLine"></p>
    <button id="finalBtn" class="pixbtn">Fortsätt spela</button>
  </div>
</div>
<div id="hint">Piltangenter eller WASD för att gå. Mellanslag för att prata och göra saker.</div>
<div id="pad">
  <div class="dpad">
    <button class="u" data-k="up" aria-label="Upp">▲</button>
    <button class="l" data-k="left" aria-label="Vänster">◀</button>
    <button class="r" data-k="right" aria-label="Höger">▶</button>
    <button class="d" data-k="down" aria-label="Ner">▼</button>
  </div>
  <button id="abtn" data-k="a" aria-label="Gör">A</button>
</div>

<script>
(()=>{
'use strict';
// ====== Ändra här ======
const AVSANDARE = 'Anna'; // vem presenten är från
const ALDER = 45;          // hur gammal Stefan fyller
// =======================

const W=320,H=240,T=16;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function txt(s,x,y,c,size,align){ctx.font=(size||14)+'px VT323, ui-monospace, monospace';ctx.textAlign=align||'left';ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillText(s,x+1,y+1);ctx.fillStyle=c||'#fff';ctx.fillText(s,x,y);}
function txt2(s,x,y,c,size){ctx.font=(size||10)+'px VT323, ui-monospace, monospace';ctx.textAlign='center';ctx.fillStyle=c;ctx.fillText(s,x,y);}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---------- Sprites ----------
const PAL={H:'#5e3b1f',h:'#8b5a2e',G:'#b9b2a8',S:'#e9b690',s:'#c98f6b',W:'#ffffff',E:'#3d86e0',B:'#a47b62',M:'#b0625a',
  T:'#e0492f',t:'#a9311c',P:'#6f7d45',p:'#56623a',F:'#2aa7d8',K:'#2a1b12',R:'#ff5fa8',Y:'#e8c14a'};
function mk(rows,pal){const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const g=c.getContext('2d');
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>{const col=pal[ch];if(col){g.fillStyle=col;g.fillRect(x,y,1,1);}}));return c;}

const HEAD_D=[
"...HHHHHH...",
"..HHhHHhHH..",
".HHhHHHHhHH.",
".HGSSSSSSGH.",
"HHSSSSSSSSHH",
"HHSWESSWESHH",
"HhSSSSSSSShH",
"HHBSSMMSSBHH",
".HHBBBBBBHH.",
".HHTTSSTTHH."];
const HEAD_DG=HEAD_D.slice();HEAD_DG[4]="HHSRRSSRRSHH";HEAD_DG[5]="HHSRRYYRRSHH";HEAD_DG[6]="HhSSRSSRSShH";
const HEAD_U=[
"...HHHHHH...",
"..HHhHHhHH..",
".HHhHHHHhHH.",
".HHHHhHHHHH.",
"HHhHHHHHHhHH",
"HHHHHhhHHHHH",
"HhHHHHHHHHhH",
"HHHHhHHhHHHH",
".HHHHHHHHHH.",
".HHTTTTTTHH."];
const BODY_D=[
"STTTTTTTTTTS",
"STTTTTTTTTTS",
"StTTTTTTTTtS",
"s.PPPPPPPP.s",
"..PPPppPPP.."];
const LEGS_D=[
["..SS....SS..","..SS....SS..",".FFF....FFF."],
["..SS....SS..","..FF....SS..","........FFF."],
["..SS....SS..","..SS....FF..",".FFF........"]];
const HEAD_S=[
"...HHHHHH...",
"..HHhHHHHH..",
".HHhHHHHHHH.",
".HHHHGSSSSS.",
"HHHHHSSSSSS.",
"HHhHHSSSWES.",
"HHHHHSSSSSSs",
"HhHHHBSSSMS.",
".HHHHBBBBB..",
"..HHTTSSTT.."];
const HEAD_SG=HEAD_S.slice();HEAD_SG[4]="HHHHHSSRRSS.";HEAD_SG[5]="HHhHHSYRRRS.";HEAD_SG[6]="HHHHHSSSRSSs";
const BODY_S=[
"...TTTTTTT..",
"...TTTSTTT..",
"...TTTSTTT..",
"...PPPsPPP..",
"...PPPPPP..."];
const LEGS_S=[
["....SS.SS...","....SS.SS...","...FFF.FFF.."],
["...SS...SS..","..SS.....SS.",".FFF.....FFF"],
["....SSSS....","....SSSS....","...FFFFF...."]];
const SPR=[0,1].map(g=>({
  down:LEGS_D.map(l=>mk([...(g?HEAD_DG:HEAD_D),...BODY_D,...l],PAL)),
  up:LEGS_D.map(l=>mk([...HEAD_U,...BODY_D,...l],PAL)),
  side:LEGS_S.map(l=>mk([...(g?HEAD_SG:HEAD_S),...BODY_S,...l],PAL))
}));

const NPC_ROWS=[
"....HHHH....",
"...HHHHHH...",
"..HHHHHHHH..",
"..HSSSSSSH..",
"..SSSSSSSS..",
"..SWESSWES..",
"..SSSSSSSS..",
"..SSSMMSSS..",
"...SSSSSS...",
"....SSSS....",
".TTTTTTTTTT.",
"STTTTTTTTTTS",
"StTTTTTTTTtS",
"s.PPPPPPPP.s",
"..PPPppPPP..",
"..PP....PP..",
"..PP....PP..",
".KKK....KKK."];
const npcPal=o=>Object.assign({},PAL,{E:'#4a3a2a'},o);
const NPCS={
  roffe:mk(NPC_ROWS,npcPal({H:'#8f8f8f',T:'#2f5f9e',t:'#234a7c',P:'#2f5f9e',p:'#234a7c',K:'#222',S:'#e0a987'})),
  teacher:mk(NPC_ROWS,npcPal({H:'#d9b45a',T:'#f4f6f7',t:'#cfd8dc',P:'#f4f6f7',p:'#cfd8dc',K:'#7fd1c1'})),
  instr:mk(NPC_ROWS,npcPal({H:'#3a2a1a',T:'#f07a2a',t:'#c45f1c',P:'#f07a2a',p:'#c45f1c',K:'#333'})),
};


// ---- Festgästerna: familjerna ----
const HEADS={
 long:["...HHHHHH...","..HHHHHHHH..",".HHHHHHHHHH.",".HHSSSSSSHH.",".HSSSSSSSSH.",".HSWESSWESH.",".HSSSSSSSSH.",".HSSSMMSSSH.",".HHSSSSSSHH.",".HHHSSSSHHH."],
 bangs:["...HHHHHH...","..HHHHHHHH..",".HHHHHHHHHH.",".HHHHHHHHHH.",".HSSSSSSSSH.",".HSWESSWESH.",".HSSSSSSSSH.",".HSSSMMSSSH.",".HHSSSSSSHH.",".HHHSSSSHHH."],
 shortdyed:["...HHHHHH...","..HHHHHHHH..","..HHHHHHHH..","..HHHHSSSH..","..HHSSSSSS..","..SWESSWES..","..SSSSSSSS..","..SSSMMSSS..","...SSSSSS...","....SSSS...."],
 beard:["....HHHH....","...HHHHHH...","..HHHHHHHH..","..HSSSSSSH..","..SSSSSSSS..","..SWESSWES..","..DSSSSSSD..","..DDSMMSDD..","..DDDDDDDD..","...DDDDDD..."]};
const BODIES={
 tall:[".TTTTTTTTTT.","STTTTTTTTTTS","STTTTTTTTTTS","StTTTTTTTTtS","s.PPPPPPPP.s","..PPPppPPP..","..PP....PP..","..PP....PP..","..PP....PP..",".KKK....KKK."],
 adult:[".TTTTTTTTTT.","STTTTTTTTTTS","StTTTTTTTTtS","s.PPPPPPPP.s","..PPPppPPP..","..PP....PP..","..PP....PP..",".KKK....KKK."],
 kid9:["..TTTTTTTT..",".STTTTTTTTS.",".StTTTTTTtS.","..PPPPPPPP..","...PP..PP...","..KKK..KKK.."],
 kid4:["..TTTTTTTT..",".STTTTTTTTS.","..TTTTTTTT..","...SS..SS...","..KK....KK.."]};
function person(o){const rows=[...HEADS[o.head],...BODIES[o.body]].map(r=>r.split(''));
  for(let i=0;i<(o.hairRows||0);i++){const r=rows[10+i];r[1]='H';r[10]='H';}
  if(o.head==='beard'){['D','D','D','D'].forEach((c,i)=>rows[10][4+i]='D');}
  (o.grey||[]).forEach(([y,x])=>{if(rows[y][x]==='H')rows[y][x]='G';});
  return mk(rows.map(r=>r.join('')),npcPal(o.pal));}
const GREY=[[0,4],[1,3],[2,8],[3,2],[1,7],[4,1],[6,10]];
Object.assign(NPCS,{
 asa:person({head:'long',body:'tall',hairRows:4,pal:{H:'#6b4226',E:'#3fa05a',T:'#7a5ca8',t:'#5b4282',P:'#34344a',p:'#26263a',K:'#2a2a2a'}}),
 luna:person({head:'shortdyed',body:'tall',pal:{H:'#1d1a22',T:'#2b2b33',t:'#1b1b22',P:'#3b5a8a',p:'#2c4670',K:'#eeeeee'}}),
 lilly:person({head:'long',body:'kid9',hairRows:4,pal:{H:'#e8c86a',E:'#3d86e0',T:'#ff8fb8',t:'#d96a95',P:'#5a6fb0',p:'#475a94',K:'#fff'}}),
 anna:person({head:'bangs',body:'adult',hairRows:1,grey:GREY,pal:{H:'#dcc38e',G:'#cfcac0',E:'#3d86e0',T:'#2f9e9a',t:'#227775',P:'#3b4f7a',p:'#2d3d60',K:'#8a5a3a'}}),
 lo:person({head:'long',body:'kid4',hairRows:3,pal:{H:'#f0c64a',E:'#3d86e0',T:'#ffd23f',t:'#e0b21f',P:'#ffd23f',p:'#e0b21f',K:'#ff6a8a'}}),
 mathias:person({head:'beard',body:'tall',pal:{H:'#3e2716',D:'#3e2716',E:'#3d86e0',T:'#b8412f',t:'#8f3122',P:'#2f3f66',p:'#23304f',K:'#4a3020'}}),
 sofia:person({head:'bangs',body:'adult',hairRows:4,grey:GREY,pal:{H:'#a8804f',G:'#cfc8bc',E:'#3d86e0',T:'#e3b04b',t:'#c08e2f',P:'#4a4458',p:'#383344',K:'#2a2a2a'}})
});

// ---------- State ----------
let t=0;
const state={mode:'title',busy:false,adr:70,cold:10,stars:new Set(),glasses:false,candles:true,finale:false,
  fade:0,banner:{s:'',t:0},shake:0,sparkT:0,sparkX:0,sparkY:0};
const P={x:80,y:136,face:'down',anim:0,moving:false,slide:null,oneFlop:false};
let scene=null,F=null;
const parts=[],floaters=[];

// ---------- Input ----------
const held=new Set(),pressed=new Set();
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  Space:'a',Enter:'a',KeyE:'a',KeyZ:'a',Digit1:'1',Digit2:'2',Digit3:'3'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(!k)return;if(e.target&&e.target.tagName==='BUTTON'&&k==='a'&&state.mode==='title')return;e.preventDefault();if(!held.has(k))pressed.add(k);held.add(k);});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)held.delete(k);});
addEventListener('blur',()=>held.clear());
document.querySelectorAll('#pad [data-k]').forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();if(!held.has(k))pressed.add(k);held.add(k);};
  const off=e=>{e.preventDefault();held.delete(k);};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());});
if(matchMedia('(pointer: coarse)').matches)document.body.classList.add('touch');
addEventListener('touchstart',()=>document.body.classList.add('touch'),{once:true,passive:true});
const abtn=$('abtn');
function resize(){$('screen').style.setProperty('--u',($('screen').clientWidth/320)+'px');}
addEventListener('resize',resize);resize();

// ---------- Dialog ----------
const dEl=$('dialog'),dName=$('dname'),dText=$('dtext'),dCh=$('dchoices'),dNext=$('dnext');
let dlg=null;
function open(name,text,choices){return new Promise(res=>{
  dlg={text,choices:choices||null,sel:0,shown:0,res};
  dEl.style.display='block';dName.textContent=name||'';dName.style.display=name?'block':'none';
  dText.textContent='';dCh.innerHTML='';dNext.style.visibility='hidden';});}
const say=(n,s)=>open(n,s);
const ask=(n,s,c)=>open(n,s,c);
async function seq(lines){for(const [n,s] of lines)await say(n,s);}
function renderChoices(){dCh.innerHTML='';dlg.choices.forEach((c,i)=>{const b=document.createElement('button');
  b.textContent=(i===dlg.sel?'▶ ':'  ')+c;if(i===dlg.sel)b.className='sel';
  b.addEventListener('click',e=>{e.stopPropagation();if(dlg)choose(i);});dCh.appendChild(b);});}
function finishType(){dlg.shown=dlg.text.length;dText.textContent=dlg.text;if(dlg.choices)renderChoices();else dNext.style.visibility='visible';}
function updateDialog(dt){if(dlg.shown<dlg.text.length){dlg.shown=Math.min(dlg.text.length,dlg.shown+dt*60);dText.textContent=dlg.text.slice(0,Math.floor(dlg.shown));if(dlg.shown>=dlg.text.length)finishType();}}
function dialogAction(){if(!dlg)return;if(dlg.shown<dlg.text.length){finishType();return;}if(dlg.choices)choose(dlg.sel);else close(0);}
function choose(i){close(i);}
function close(v){const r=dlg.res;dlg=null;dEl.style.display='none';r(v);}
dEl.addEventListener('click',()=>{if(!dlg)return;if(dlg.shown<dlg.text.length)finishType();else if(!dlg.choices)close(0);});
function handleDialogInput(){
  if(pressed.has('a')){dialogAction();return;}
  if(dlg&&dlg.choices&&dlg.shown>=dlg.text.length){const n=dlg.choices.length;
    if(pressed.has('up')||pressed.has('left')){dlg.sel=(dlg.sel+n-1)%n;renderChoices();}
    if(pressed.has('down')||pressed.has('right')){dlg.sel=(dlg.sel+1)%n;renderChoices();}
    ['1','2','3'].forEach((k,i)=>{if(dlg&&pressed.has(k)&&i<n)choose(i);});}
}

// ---------- Helpers ----------
async function runEvent(fn){if(state.busy)return;state.busy=true;try{await fn();}catch(err){console.error(err);}finally{state.busy=false;}}
function cycle(e,arr){const i=(e.n||0)%arr.length;e.n=(e.n||0)+1;return arr[i];}
function floater(s,x,y,c){floaters.push({s,x,y,c:c||'#fff',l:1.4});}
function addAdr(n){state.adr=clamp(state.adr+n,0,100);
  const x=state.mode==='fall'?F.x:P.x,y=state.mode==='fall'?F.sy-26:P.y-24;
  floater((n>0?'+':'')+n+' adrenalin',x,y,n>0?'#ffb36b':'#9fc3ff');}
function sparks(x,y,dur){state.sparkX=x;state.sparkY=y;state.sparkT=dur;}
function confetti(){const cols=['#ff5fa8','#ffd23f','#5ab4ff','#7ddc6a','#ff7a3d','#fff'];

function makeSolid(opens,edge){const g=[];for(let y=0;y<15;y++){g[y]=[];for(let x=0;x<20;x++)g[y][x]=(y<=1||y===14||x===0||x===19)?1:0;}
  opens.forEach(([x,y])=>g[y][x]=0);return g;}
const SCENES={};
function def(id,o){o.id=id;o.solid=makeSolid(o.opens||[]);
  o.ents=o.ents.map(e=>Object.assign({px:e.x*T,py:e.y*T,pw:(e.w||1)*T,ph:(e.h||1)*T},e));
  o.exits=(o.exits||[]).map(x=>Object.assign({px:x.x*T,py:x.y*T,pw:T,ph:2*T},x));SCENES[id]=o;}
function visEnts(){return scene.ents.filter(e=>!e.when||e.when());}
function isBlocked(ex){return ex.lock&&ex.lock();}
function paintBg(sc){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');const r=rng(sc.seed||7);
  const Q=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
  for(let ty=0;ty<15;ty++)for(let tx=0;tx<20;tx++){const x=tx*T,y=ty*T;if(sc.solid[ty][tx])sc.wall(Q,x,y,tx,ty,r);else sc.floor(Q,x,y,tx,ty,r);}
  if(sc.deco)sc.deco(Q,r);return c;}

function freefall(){return new Promise(res=>{state.mode='fall';
  F={t:0,dur:20,x:160,sy:100,items:[],clouds:[],spawn:0.8,res,flipped:false,chute:false,flop:null};
  for(let i=0;i<9;i++)F.clouds.push({x:Math.random()*W,y:Math.random()*H,w:30+Math.random()*50,s:.6+Math.random()*.8});});}
function updateFall(dt){F.t+=dt;const k=F.chute?.35:1;
  const mx=(held.has('right')?1:0)-(held.has('left')?1:0);F.x=clamp(F.x+mx*125*dt,16,W-16);
  state.cold=clamp(state.cold+(F.chute?1:5)*dt,0,100);
  for(const c of F.clouds){c.y-=150*k*c.s*dt;if(c.y<-20){c.y=H+20;c.x=Math.random()*W;}}
  F.spawn-=dt;if(F.spawn<=0&&!F.chute){F.spawn=.33;F.items.push({x:16+Math.random()*(W-32),y:H+10,type:Math.random()<.28?'goose':'bolt',ph:Math.random()*6});}
  for(const it of F.items){it.y-=150*k*dt;if(it.type==='goose')it.x+=Math.sin(F.t*3+it.ph)*25*dt;
    if(!it.hit&&Math.abs(it.x-F.x)<12&&Math.abs(it.y-F.sy)<14){it.hit=true;
      if(it.type==='bolt'){addAdr(4);}else{state.shake=.3;floater('GÅS I ANSIKTET!',F.x,F.sy-40,'#fff');addAdr(7);}}}
  F.items=F.items.filter(i=>!i.hit&&i.y>-20);
  if(!F.flipped&&F.t>7){F.flipped=true;floater('NEJ! FLIP-FLOPPEN!',F.x,F.sy-40,'#ffe07a');F.flop={x:F.x+4,y:F.sy+18};}
  if(F.flop){F.flop.y-=70*dt;F.flop.x+=12*dt;}
  if(!F.chute&&F.t>F.dur*.72){F.chute=true;floater('SKÄRMEN UTE!',F.x,F.sy-56,'#fff');}
  if(F.t>=F.dur){state.mode='play';goScene('airfield',6,8.3);P.face='down';const r=F.res;F=null;r();}}
function drawFall(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4fa9ef');g.addColorStop(1,'#c5eaff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const gs=F.dur-3;if(F.t>gs){const gy=H-(F.t-gs)/3*70;R(0,gy,W,H,'#5fa843');R(40,gy+10,60,30,'#8fbf4a');R(180,gy+6,90,40,'#c9b458');R(120,gy+30,50,20,'#4e8f39');}
  for(const c of F.clouds){R(c.x,c.y,c.w,8,'rgba(255,255,255,.85)');R(c.x+6,c.y-5,c.w-14,6,'rgba(255,255,255,.85)');R(c.x+4,c.y+8,c.w-8,3,'rgba(255,255,255,.55)');}
  for(const it of F.items){const x=it.x,y=it.y;
    if(it.type==='bolt'){R(x,y-5,3,3,'#ffd23f');R(x-1,y-2,5,2,'#ffd23f');R(x-2,y,3,3,'#ffd23f');R(x+1,y-4,1,1,'#fff6c4');}
    else{const f=Math.floor(F.t*8+it.ph)%2;R(x-5,y-2,10,5,'#fff');R(x+3,y-6,2,5,'#fff');R(x+3,y-8,4,3,'#fff');R(x+7,y-7,2,1,'#f39c12');R(x+5,y-7,1,1,'#222');R(x-3,y-2-(f?3:0),6,2,'#ddd');}}
  if(F.flop){R(F.flop.x,F.flop.y,5,2,'#2aa7d8');R(F.flop.x+2,F.flop.y-1,1,1,'#2aa7d8');}

  ctx.drawImage(SPR[state.glasses?1:0].down[0],Math.round(x-12),F.sy-18,24,36);
  if(F.flipped)R(Math.round(x-12)+16,F.sy+16,6,2,PAL.S);
  if(F.t<3.2)txt('Styr med vänster och höger. Fånga blixtarna!',W/2,46,'#fff',15,'center');}

// ---------- Player & movement ----------
function solidAt(px,py){const tx=Math.floor(px/T),ty=Math.floor(py/T);if(tx<0||ty<0||tx>=20||ty>=15)return true;return scene.solid[ty][tx]===1;}
function hit(x,y){const l=x-5,r=x+4,tp=y-4,b=y;
  if(solidAt(l,tp)||solidAt(r,tp)||solidAt(l,b)||solidAt(r,b))return true;
  for(const e of visEnts()){if(e.solid===false)continue;if(r>=e.px&&l<e.px+e.pw&&b>=e.py&&tp<e.py+e.ph)return true;}return false;}
function move(dx,dy){if(!hit(P.x+dx,P.y))P.x+=dx;if(!hit(P.x,P.y+dy))P.y+=dy;}
function target(){const v=dirv(P.face),fx=P.x+v[0]*10,fy=P.y-3+v[1]*10,m=4;let best=null;
  for(const e of visEnts()){if(!e.act)continue;if(fx>=e.px-m&&fx<=e.px+e.pw+m&&fy>=e.py-m&&fy<=e.py+e.ph+m)best=e;}return best;}
function goScene(id,sx,sy){scene=SCENES[id];if(!scene.bg)scene.bg=paintBg(scene);P.x=sx*T;P.y=sy*T;P.face=sx<10?'right':'left';
  state.fade=1;state.banner={s:scene.name,t:2.2};parts.length=0;
  if(scene.enter&&!scene.visited){scene.visited=true;setTimeout(()=>runEvent(scene.enter),350);}scene.visited=true;}
function drawPlayer(){const g=state.glasses?1:0;
  R(P.x-5,P.y-2,10,3,'rgba(0,0,0,.22)');
  if(P.slide){ctx.save();ctx.translate(Math.round(P.x),Math.round(P.y-6));ctx.rotate(P.face==='left'?Math.PI/2:-Math.PI/2);ctx.drawImage(SPR[g].down[0],-6,-9);ctx.restore();return;}
  const key=(P.face==='left'||P.face==='right')?'side':P.face;const fr=P.moving?[1,0,2,0][Math.abs(Math.floor(P.anim*8))%4]:0;
  const s=SPR[g][key][fr],x=Math.round(P.x-6),y=Math.round(P.y-17);
  if(P.face==='left'){ctx.save();ctx.translate(x+12,y);ctx.scale(-1,1);ctx.drawImage(s,0,0);ctx.restore();}else ctx.drawImage(s,x,y);
  if(P.oneFlop&&key!=='side'&&fr===0)R(x+8,y+17,3,1,PAL.S);}

  if(state.mode==='fall'){R(W-66,4,62,15,'rgba(22,14,30,.75)');txt(Math.max(0,Math.round(4000*(1-F.t/F.dur)))+' m',W-8,15,'#fff',14,'right');}
  else{R(W-35,4,31,13,'rgba(22,14,30,.75)');for(let i=0;i<3;i++)drawStar(W-32+i*9,7,i<state.stars.size);}}
function drawTitle(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ff9f5a');g.addColorStop(.6,'#ffd9a0');g.addColorStop(1,'#ffe9c4');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  R(236,150,40,40,'rgba(255,240,200,.55)');R(0,206,W,34,'#5fa843');R(0,206,W,2,'#76c257');
  const fr=[1,0,2,0][Math.abs(Math.floor(t*5))%4],b=Math.round(Math.abs(Math.sin(t*5))*2);
  R(W/2-26,226,52,6,'rgba(0,0,0,.2)');ctx.drawImage(SPR[0].down[fr],W/2-30,138-b,60,90);}

// ---------- Particles ----------
function updParts(dt){
  if(state.sparkT>0){state.sparkT-=dt;for(let i=0;i<4;i++)parts.push({x:state.sparkX,y:state.sparkY,vx:(Math.random()-.5)*130,vy:-Math.random()*100,g:280,l:.35+Math.random()*.4,c:Math.random()<.5?'#fff3a0':'#ffb13b',s:1});}
  for(const p of parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;}
  for(let i=parts.length-1;i>=0;i--)if(parts[i].l<=0||parts[i].y>H+10)parts.splice(i,1);
  for(const f of floaters){f.y-=16*dt;f.l-=dt;}
  for(let i=floaters.length-1;i>=0;i--)if(floaters[i].l<=0)floaters.splice(i,1);}
function drawParts(){for(const p of parts)R(p.x,p.y,p.s,p.s,p.c);
  for(const f of floaters){ctx.globalAlpha=clamp(f.l,0,1);txt(f.s,f.x,f.y,f.c,13,'center');ctx.globalAlpha=1;}}

// ---------- Loop ----------
function startGame(){if(state.mode!=='title')return;$('title').style.display='none';state.mode='play';goScene('workshop',5,8.5);P.face='down';
  setTimeout(()=>runEvent(async()=>{
    await say('','Det här är Stefan. Idag är det den 28 september och han fyller år. Han firar i shorts och flip-flops, som vanligt.');
    await say('','Stefan behöver adrenalin. Sjunker mätaren till noll dör han av tristess. Nästan.');
    await say('','Samla tre stjärnor genom att göra tveksamma saker. Gå fram till saker och tryck mellanslag eller A.');}),400);}
$('startBtn').addEventListener('click',startGame);

function update(dt){t+=dt;
  if(state.fade>0)state.fade=Math.max(0,state.fade-dt*2.5);
  if(state.banner.t>0)state.banner.t-=dt;
  if(state.shake>0)state.shake-=dt;
  updParts(dt);
  if(state.mode==='title'){if(pressed.has('a'))startGame();return;}
  if(dlg){updateDialog(dt);handleDialogInput();return;}
  if(state.mode==='fall'){if(F)updateFall(dt);return;}
  if(P.slide){P.slide.t+=dt;if(P.slide.t<.8){const v=dirv(P.face);move(v[0]*110*dt,v[1]*110*dt);}
    if(P.slide.t>1.5){const r=P.slide.res;P.slide=null;r();}return;}
  if(state.busy)return;
  state.adr=Math.max(0,state.adr-dt/1.1);state.cold=clamp(state.cold+scene.cold*dt,0,100);
  if(state.adr<=0){runEvent(boredom);return;}
  if(state.cold>=100){runEvent(freezing);return;}
  const mx=(held.has('right')?1:0)-(held.has('left')?1:0),my=(held.has('down')?1:0)-(held.has('up')?1:0);
  if(mx||my){if(mx)P.face=mx>0?'right':'left';else P.face=my>0?'down':'up';const l=Math.hypot(mx,my);move(mx/l*72*dt,my/l*72*dt);P.anim+=dt;P.moving=true;}
  else{P.moving=false;P.anim=0;}
  if(pressed.has('a')){const tg=target();if(tg)runEvent(()=>tg.act(tg));}
  for(const ex of scene.exits){if(isBlocked(ex))continue;if(P.x>=ex.px&&P.x<ex.px+ex.pw&&P.y>=ex.py&&P.y<ex.py+ex.ph){goScene(ex.to,ex.sx,ex.sy);break;}}}

function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  if(state.mode==='title'){drawTitle();return;}
  if(state.shake>0)ctx.setTransform(1,0,0,1,(Math.random()*4-2)|0,(Math.random()*4-2)|0);
  if(state.mode==='fall'&&F){drawFall();}
  else{ctx.drawImage(scene.bg,0,0);drawExits();
    const list=visEnts().map(e=>({k:e.py+e.ph,f:()=>e.draw(e)}));list.push({k:P.y+.5,f:drawPlayer});
    list.sort((a,b)=>a.k-b.k).forEach(o=>o.f());
    const tg=(!state.busy&&!dlg&&!P.slide)?target():null;if(tg)drawBang(tg);abtn.classList.toggle('ready',!!tg);}
  drawParts();ctx.setTransform(1,0,0,1,0,0);
  if(state.mode!=='fall'||F)drawHud();
  if(state.banner.t>0&&state.mode==='play'){ctx.globalAlpha=clamp(state.banner.t,0,1);txt(state.banner.s,W/2,58,'#fff',22,'center');ctx.globalAlpha=1;}
  if(state.fade>0){ctx.fillStyle='rgba(0,0,0,'+state.fade+')';ctx.fillRect(0,0,W,H);}}

let last=performance.now();
function loop(now){const dt=clamp((now-last)/1000,0,.05);last=now;update(dt);draw();pressed.clear();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
